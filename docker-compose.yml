services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-admin}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4173}
      DB_PATH: /data/app.db
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - api-data:/data
    privileged: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001/api}
    depends_on:
      - api
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "4173:4173"
    restart: unless-stopped

volumes:
  api-data:
